  msw: true
  sharp: true
  '@parcel/watcher': true
  unrs-resolver: true

catalog:
  next: 16.4.2
  react: 19.3.1
  react-dom: 19.3.1
  antd: 6.6.6
  '@ant-design/icons': 6.3.4
  '@ant-design/cssinjs': 2.1.2
  '@ant-design/nextjs-registry': 1.3.0
  '@tanstack/react-query': 5.104.3
  next-intl: 4.14.9
  zod: 4.6.7
  zustand: 5.0.15
  dayjs: 1.11.23
  dompurify: 3.4.17
  msw: 3.0.3
  '@tiptap/react': 3.32.0
  '@tiptap/starter-kit': 3.32.0
  '@tiptap/pm': 3.32.0
  typescript: 6.0.3
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/node': 24.19.2
  vitest: 5.0.5
  '@vitejs/plugin-react': 6.1.2
  jsdom: 30.1.3
  '@testing-library/react': 16.3.3
  eslint: 9.39.5
  '@eslint/js': 9.39.5
  typescript-eslint: 8.71.2
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-jsx-a11y: 6.10.2
  '@next/eslint-plugin-next': 16.4.2
  eslint-plugin-boundaries: 7.2.0
  globals: 17.13.0

minimumReleaseAgeExclude:
