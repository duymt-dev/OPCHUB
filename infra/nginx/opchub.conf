# OPCHUB — Nginx (ADR-0004). Cài: /etc/nginx/conf.d/opchub.conf (nginx.conf có `include conf.d/*.conf;` trong http{}).
# Snippet dùng chung: chép infra/nginx/snippets/opchub-backend.conf → /etc/nginx/snippets/opchub-backend.conf.
#
# Tên miền (L3 — chủ nhà xác nhận, đang là giá trị dự kiến):
#   Portal : opchub.community, www.opchub.community
#   Admin  : admin.opchub.community
#   S3     : s3.opchub.community (presigned PUT/GET từ trình duyệt → RustFS, ADR-0007)
# TLS (L3): `certbot certonly --webroot -w /var/www/certbot -d <domain>` rồi đổi `listen 443` → `listen 443 ssl`,
#           thêm `http2 on;` và bỏ comment các dòng ssl_* trong từng server.
#
# Cổng nội bộ (infra/README.md §Cổng): api@i → 410i, socket@i → 420i, portal@i → 310i, admin → 3200, S3 → 9000.
# Thêm instance: bỏ comment / thêm dòng `server` trong upstream, rồi `nginx -t && systemctl reload nginx`.

upstream opchub_api {
    least_conn;
    server 127.0.0.1:4101 max_fails=3 fail_timeout=10s;
    # server 127.0.0.1:4102 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream opchub_socket {
    # Transport chỉ websocket (redis-io.adapter); ip_hash để reconnect từ cùng IP về cùng instance.
    ip_hash;
    server 127.0.0.1:4201 max_fails=3 fail_timeout=10s;
    # server 127.0.0.1:4202 max_fails=3 fail_timeout=10s;
}

upstream opchub_portal {
    least_conn;
    server 127.0.0.1:3101 max_fails=3 fail_timeout=10s;
    # server 127.0.0.1:3102 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream opchub_admin {
    server 127.0.0.1:3200 max_fails=3 fail_timeout=10s;
    keepalive 8;
}

upstream opchub_s3 {
    server 127.0.0.1:9000;
    keepalive 16;
}

# --- IP thật của client (Cloudflare đứng trước, ADR-0004) ---
# L3: điền dải IP Cloudflare hiện hành (https://www.cloudflare.com/ips/) và cập nhật định kỳ.
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 2400:cb00::/32;
# real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# --- Rate limit (sau real_ip nên $binary_remote_addr là IP client thật) ---
limit_req_zone $binary_remote_addr zone=opchub_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=opchub_register:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=opchub_api:20m rate=20r/s;
limit_req_status 429;

map $http_upgrade $opchub_connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Nén ---
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/xml image/svg+xml application/manifest+json;

server_tokens off;

# Log có thời gian phản hồi — dùng đo SLO (infra/monitoring/slo.md). $9 vẫn là mã HTTP như combined.
log_format opchub_timed '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';

# --- HTTP: thư mục xác minh certbot + chuyển HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name opchub.community www.opchub.community admin.opchub.community s3.opchub.community;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------- User Portal ----------------
server {
    listen 443;
    listen [::]:443;
    server_name opchub.community www.opchub.community;

    # ssl_certificate     /etc/letsencrypt/live/opchub.community/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/opchub.community/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/opchub-portal.access.log opchub_timed;
    error_log  /var/log/nginx/opchub-portal.error.log warn;

    include /etc/nginx/snippets/opchub-backend.conf;

    location ^~ /_next/static/ {
        proxy_pass http://opchub_portal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://opchub_portal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ---------------- Admin Dashboard ----------------
server {
    listen 443;
    listen [::]:443;
    server_name admin.opchub.community;

    # ssl_certificate     /etc/letsencrypt/live/admin.opchub.community/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.opchub.community/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/opchub-admin.access.log opchub_timed;
    error_log  /var/log/nginx/opchub-admin.error.log warn;

    include /etc/nginx/snippets/opchub-backend.conf;
    # Admin không cho máy tìm kiếm index (đặt ở mức server để không che header bảo mật của snippet)
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /_next/static/ {
        proxy_pass http://opchub_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://opchub_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ---------------- S3 (RustFS) công khai cho presigned URL ----------------
# Server ký URL theo S3_ENDPOINT → production đặt S3_ENDPOINT=https://s3.opchub.community (Q-B64-3).
# Host phải giữ nguyên ($http_host) vì nằm trong chữ ký SigV4.
server {
    listen 443;
    listen [::]:443;
    server_name s3.opchub.community;

    # ssl_certificate     /etc/letsencrypt/live/s3.opchub.community/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/s3.opchub.community/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/opchub-s3.access.log opchub_timed;
    error_log  /var/log/nginx/opchub-s3.error.log warn;

    # Ảnh ≤ 5MB (B66), tệp chat ≤ 20MB (D-98) + dư cho header
    client_max_body_size 21m;
    proxy_request_buffering off;

    location / {
        proxy_pass http://opchub_s3;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
