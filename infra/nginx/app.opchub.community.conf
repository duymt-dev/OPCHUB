# OPCHUB — Nginx config for app.opchub.community
# Portal: root /
# Admin: path /admin

upstream opchub_portal {
    least_conn;
    server 127.0.0.1:4301 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream opchub_admin {
    server 127.0.0.1:3200 max_fails=3 fail_timeout=10s;
    keepalive 8;
}

upstream opchub_api {
    least_conn;
    server 127.0.0.1:4101 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream opchub_socket {
    ip_hash;
    server 127.0.0.1:4201 max_fails=3 fail_timeout=10s;
}

upstream opchub_s3 {
    server 127.0.0.1:9000;
    keepalive 16;
}

map $http_upgrade $opchub_connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP: Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.opchub.community;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: Portal (/) and Admin (/admin)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.opchub.community;

    ssl_certificate /etc/letsencrypt/live/app.opchub.community/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.opchub.community/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/opchub-app.access.log postdata;
    error_log  /var/log/nginx/opchub-app.error.log warn;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Duplicate Portal host only; preserves inherited security headers in the root location.
    add_header X-Robots-Tag "noindex" always;

    # ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # REST API
    location /v1/ {
        proxy_pass http://opchub_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Socket.IO
    location /socket.io/ {
        proxy_pass http://opchub_socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $opchub_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # S3 Object Storage (RustFS)
    location /opchub/ {
        proxy_pass http://opchub_s3;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 101m;
        proxy_request_buffering off;
    }

    # Admin: static assets (_next/static)
    location = /sw.js {
        proxy_pass http://opchub_portal;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        proxy_pass http://opchub_portal;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }
    location = /admin/sw.js {
        proxy_pass http://opchub_admin;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /admin/_next/static/ {
        proxy_pass http://opchub_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Admin: app routing
    location ^~ /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://opchub_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Portal: static assets (_next/static)
    location ^~ /_next/static/ {
        proxy_pass http://opchub_portal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Portal: app routing (root)
    location / {
        proxy_pass http://opchub_portal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# TIP-V46-810: /g/<slug> is served by Portal SSR. Robots are per-page metadata;
# The canonical host remains indexable; this duplicate app host is noindex (TIP-820).
