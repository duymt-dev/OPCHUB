# OPCHUB — phần chung cho server Portal và Admin: header bảo mật, /v1 → api, /socket.io → socket.
# Cài: /etc/nginx/snippets/opchub-backend.conf. Chỉ include bên trong khối server{}.

# Upload đi thẳng S3 bằng presigned URL (S-08) nên body qua Nginx nhỏ.
# Thứ tự giới hạn (TD-015): nginx 1m > body-parser JSON 768kb (apps/server/src/common/http/body-limits.ts)
# > payload zod lớn nhất (chiến dịch ≈ 300 kB).
client_max_body_size 1m;

# Quá cỡ → trả envelope JSON như API (BUG-003) để client parse được thay vì trang HTML của nginx.
error_page 413 = @too_large;
location @too_large {
    default_type application/json;
    return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Dữ liệu gửi lên quá lớn"}}';
}

# --- Header bảo mật ---
# HSTS chỉ bật sau khi TLS chạy ổn (L3): bỏ comment dòng dưới.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# --- Webhook ngân hàng: không qua zone login/register; HMAC kiểm ở server ---
location = /v1/webhooks/bank {
    client_max_body_size 64k;
    proxy_pass http://opchub_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
}

# --- Đăng nhập: chống dò mật khẩu ---
location = /v1/auth/login {
    limit_req zone=opchub_login burst=5 nodelay;
    client_max_body_size 16k;
    proxy_pass http://opchub_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
}

# --- Đăng ký (personal/business) + OTP verify/resend ---
location ~ ^/v1/auth/(register|otp)/ {
    limit_req zone=opchub_register burst=5 nodelay;
    client_max_body_size 64k;
    proxy_pass http://opchub_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
}

# --- REST API ---
location /v1/ {
    limit_req zone=opchub_api burst=60 nodelay;
    proxy_pass http://opchub_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Ghi đè (không nối) để client không giả được IP; server đặt TRUST_PROXY=true.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503;
}

# --- Socket.IO (websocket-only) ---
location /socket.io/ {
    proxy_pass http://opchub_socket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $opchub_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    # pingInterval 25s + pingTimeout 20s → 1 giờ là dư; tránh Nginx cắt kết nối rảnh.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
