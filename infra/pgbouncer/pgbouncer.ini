; OPCHUB — PgBouncer (S-07). Cài: /etc/pgbouncer/pgbouncer.ini (owner postgres, 0640).
;
; Ứng dụng nối qua PgBouncer (transaction pooling):
;   DATABASE_URL=postgresql://opchub_app:<pw>@127.0.0.1:6432/opchub?pgbouncer=true
;   `pgbouncer=true` để Prisma không dùng prepared statement có tên (không an toàn khi transaction pooling).
; Migration đi THẲNG Postgres, bỏ qua PgBouncer (advisory lock + DDL cần session):
;   DIRECT_URL=postgresql://opchub_migrator:<pw>@127.0.0.1:5432/opchub
;
; Ngân sách kết nối: mỗi process DB_POOL_MAX (mặc định 10) phía client; phía server tối đa default_pool_size.
; (api×2 + socket×3 + worker) × 10 = 60 client ≤ max_client_conn; Postgres chỉ thấy ≤ 25+5.

[databases]
opchub = host=127.0.0.1 port=5432 dbname=opchub

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir = /var/run/postgresql

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 40

server_reset_query = DISCARD ALL
server_reset_query_always = 0
server_idle_timeout = 300
server_lifetime = 3600
query_wait_timeout = 30
client_idle_timeout = 0

; PgBouncer ≥ 1.21: theo dõi prepared statement theo protocol ở transaction mode (an toàn thêm cho driver pg)
max_prepared_statements = 200

; Prisma/pg gửi các tham số này khi mở kết nối
ignore_startup_parameters = extra_float_digits,options

; Quản trị (SHOW POOLS;) qua psql -p 6432 pgbouncer
admin_users = postgres
stats_users = postgres

logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
